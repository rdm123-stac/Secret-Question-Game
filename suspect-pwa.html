<body>
  <div id="root"></div>

  <!-- Firebase SDK -->

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAo8kg4hliypAK7zm0UsPtn1PoKvFTjkBg",
      authDomain: "robo-sheep.firebaseapp.com",
      databaseURL: "https://robo-sheep-default-rtdb.firebaseio.com",
      projectId: "robo-sheep",
      storageBucket: "robo-sheep.firebasestorage.app",
      messagingSenderId: "122251491544",

    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // Lucide Icons
    const Icon = ({ name, className = "w-6 h-6" }) => {
      const icons = {
        sparkles: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
        users: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
        play: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
        copy: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>,
        check: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
        home: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>,
        eye: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
        eyeOff: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>,
        send: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>,
        trophy: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>,
        lock: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>,
        helpCircle: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      };
      return icons[name] || null;
    };

    function SuspectGame() {
      const [screen, setScreen] = useState('home');
      const [playerName, setPlayerName] = useState('');
      const [lobbyCode, setLobbyCode] = useState('');
      const [currentLobby, setCurrentLobby] = useState(null);
      const [playerId, setPlayerId] = useState(null);
      const [gameState, setGameState] = useState(null);
      const [copied, setCopied] = useState(false);
      const [showQuestion, setShowQuestion] = useState(false);
      const [error, setError] = useState('');
      const [myAnswer, setMyAnswer] = useState('');
      const [selectedVote, setSelectedVote] = useState('');

      const questionSets = [
        {
          theme: "Music Vibes",
          normalQuestion: "Who is your favorite band or artist?",
          secretQuestion: "Who is the most overrated band or artist?"
        },
        {
          theme: "Movie Night",
          normalQuestion: "What's your favorite movie of all time?",
          secretQuestion: "What's the most overrated movie ever?"
        },
        {
          theme: "Food Talk",
          normalQuestion: "What's your favorite food?",
          secretQuestion: "What food do you think is overrated?"
        },
        {
          theme: "Travel Dreams",
          normalQuestion: "Where would you most like to visit?",
          secretQuestion: "Where do you think is the most overrated tourist destination?"
        },
        {
          theme: "Superpower Fantasy",
          normalQuestion: "If you could have any superpower, what would it be?",
          secretQuestion: "What superpower would be the most useless in real life?"
        },
        {
          theme: "Career Chat",
          normalQuestion: "What's your dream job?",
          secretQuestion: "What job do people think is glamorous but isn't?"
        },
        {
          theme: "Sports Talk",
          normalQuestion: "What's your favorite sport to watch or play?",
          secretQuestion: "What sport do you find most boring?"
        },
        {
          theme: "Pet Preferences",
          normalQuestion: "What's the best pet to have?",
          secretQuestion: "What's the worst pet to have?"
        },
        {
          theme: "Tech Life",
          normalQuestion: "What's your favorite app or website?",
          secretQuestion: "What app or website do you think is overrated?"
        },
        {
          theme: "Guilty Pleasures",
          normalQuestion: "What's your favorite TV show?",
          secretQuestion: "What TV show do you secretly hate that everyone loves?"
        },
        {
          theme: "Morning Routine",
          normalQuestion: "What's the best way to start your day?",
          secretQuestion: "What's the worst way people start their day?"
        },
        {
          theme: "Pizza Debate",
          normalQuestion: "What's the best pizza topping?",
          secretQuestion: "What's the worst pizza topping?"
        }
      ];

      useEffect(() => {
        setPlayerId(`player_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`);
      }, []);

      const generateLobbyCode = () => {
        return Math.floor(1000 + Math.random() * 9000).toString();
      };

      const createLobby = async () => {
        if (!playerName.trim()) {
          setError('Please enter your name');
          return;
        }

        const code = generateLobbyCode();
        const lobby = {
          code,
          host: playerId,
          players: [{ id: playerId, name: playerName.trim(), score: 0 }],
          status: 'waiting',
          createdAt: Date.now(),
          roundNumber: 0
        };

        try {
          await database.ref(`suspect-lobbies/${code}`).set(lobby);
          setLobbyCode(code);
          setCurrentLobby(lobby);
          setScreen('lobby');
          setError('');
        } catch (err) {
          setError('Failed to create lobby. Please try again.');
        }
      };

      const joinLobby = async () => {
        if (!playerName.trim()) {
          setError('Please enter your name');
          return;
        }
        if (!lobbyCode.trim()) {
          setError('Please enter a lobby code');
          return;
        }

        const code = lobbyCode.trim();

        try {
          const snapshot = await database.ref(`suspect-lobbies/${code}`).once('value');
          if (!snapshot.exists()) {
            setError('Lobby not found. Check the code and try again.');
            return;
          }

          const lobby = snapshot.val();

          if (lobby.status !== 'waiting') {
            setError('This game has already started');
            return;
          }

          if (lobby.players.some(p => p.id === playerId)) {
            setCurrentLobby(lobby);
            setScreen('lobby');
            setError('');
            return;
          }

          lobby.players.push({ id: playerId, name: playerName.trim(), score: 0 });
          await database.ref(`suspect-lobbies/${code}`).set(lobby);

          setCurrentLobby(lobby);
          setScreen('lobby');
          setError('');
        } catch (err) {
          setError('Failed to join lobby. Please try again.');
        }
      };

      useEffect(() => {
        if (!lobbyCode) return;

        const lobbyRef = database.ref(`suspect-lobbies/${lobbyCode}`);
        const listener = lobbyRef.on('value', (snapshot) => {
          if (!snapshot.exists()) return;

          const lobby = snapshot.val();
          setCurrentLobby(lobby);

          setScreen((prev) => {
            const isMainMenu = (prev === 'home' || prev === 'create' || prev === 'join');
            if (isMainMenu) return prev;

            if (prev === 'recap') {
              const winner = lobby.players.find(p => (p.score || 0) >= 10);
              if (winner) {
                return 'winner';
              }
            }

            if (lobby.status === 'waiting') {
              if (['game', 'answer', 'voting', 'recap'].includes(prev)) {
                setGameState(null);
                setShowQuestion(false);
                setMyAnswer('');
                setSelectedVote('');
                return 'lobby';
              }
              return prev;
            }

            return prev;
          });
        });

        return () => lobbyRef.off('value', listener);
      }, [lobbyCode]);

      useEffect(() => {
        if (!lobbyCode) return;

        const gameRef = database.ref(`suspect-games/${lobbyCode}`);
        const listener = gameRef.on('value', (snapshot) => {
          if (!snapshot.exists()) {
            setGameState(null);
            return;
          }

          const game = snapshot.val();
          setGameState(game);

          setScreen((prev) => {
            if (prev === 'home' || prev === 'create' || prev === 'join') return prev;

            if (game.phase === 'reveal') return 'game';
            if (game.phase === 'answer') return 'answer';
            if (game.phase === 'voting') return 'voting';
            if (game.phase === 'recap') return 'recap';

            return prev;
          });
        });

        return () => gameRef.off('value', listener);
      }, [lobbyCode]);

      useEffect(() => {
        if (!gameState || !lobbyCode || !playerId) return;
        if (gameState.phase !== 'reveal') return;

        const leaderId = gameState.playerOrder?.[0];
        if (leaderId !== playerId) return;

        const REVEAL_MS = 10000;
        const startedAt = gameState.startedAt || Date.now();
        const elapsed = Date.now() - startedAt;
        const remaining = Math.max(0, REVEAL_MS - elapsed);

        const t = setTimeout(async () => {
          try {
            const phaseSnap = await database.ref(`suspect-games/${lobbyCode}/phase`).once('value');
            if (phaseSnap.val() === 'reveal') {
              await database.ref(`suspect-games/${lobbyCode}/phase`).set('answer');
            }
          } catch (e) {
            console.error('auto-advance to answer failed:', e);
          }
        }, remaining);

        return () => clearTimeout(t);
      }, [gameState?.phase, gameState?.startedAt, lobbyCode, playerId]);

      useEffect(() => {
        if (screen !== 'recap' || !currentLobby) return;

        const winner = currentLobby.players.find(p => (p.score || 0) >= 10);
        if (winner) {
          const timer = setTimeout(() => {
            setScreen('winner');
          }, 1000);
          return () => clearTimeout(timer);
        }
      }, [screen, currentLobby]);

      const startGame = () => {
        if (!currentLobby) return;

        const roundNum = (currentLobby.roundNumber || 0) + 1;
        const orderStartIndex = (roundNum - 1) % currentLobby.players.length;

        const orderedPlayers = [
          ...currentLobby.players.slice(orderStartIndex),
          ...currentLobby.players.slice(0, orderStartIndex)
        ];

        const questionPickerId = orderedPlayers[0].id;

        if (playerId === questionPickerId) {
          setScreen('question-select');
          setError('');
        }
      };

      const confirmQuestionAndStartGame = async (selectedSet) => {
        if (!selectedSet) {
          setError('Please select a question');
          return;
        }

        const roundNum = (currentLobby.roundNumber || 0) + 1;
        const orderStartIndex = (roundNum - 1) % currentLobby.players.length;
        const orderedPlayers = [
          ...currentLobby.players.slice(orderStartIndex),
          ...currentLobby.players.slice(0, orderStartIndex)
        ];

        const suspectIndex = Math.floor(Math.random() * orderedPlayers.length);

        const game = {
          lobbyCode,
          theme: selectedSet.theme,
          normalQuestion: selectedSet.normalQuestion,
          secretQuestion: selectedSet.secretQuestion,
          suspectId: orderedPlayers[suspectIndex].id,
          players: orderedPlayers,
          playerOrder: orderedPlayers.map(p => p.id),
          startedAt: Date.now(),
          phase: 'reveal',
          answers: {},
          votes: {},
          recap: null,
          roundNumber: roundNum
        };

        try {
          const updatedLobby = { ...currentLobby, status: 'playing', roundNumber: roundNum };
          await database.ref(`suspect-lobbies/${lobbyCode}`).set(updatedLobby);
          await database.ref(`suspect-games/${lobbyCode}`).set(game);

          setGameState(game);
          setScreen('game');
          setError('');
        } catch (err) {
          console.error(err);
          setError('Failed to start game. Please try again.');
        }
      };

      const startAnswerPhase = async () => {
        if (!gameState) return;
        try {
          setError('');
          await database.ref(`suspect-games/${lobbyCode}/phase`).set('answer');
        } catch (err) {
          console.error('Start answer phase error:', err);
          setError('Failed to start answer phase. Please try again.');
        }
      };

      const submitAnswer = async () => {
        if (!myAnswer.trim()) {
          setError('Please enter an answer');
          return;
        }

        try {
          setError('');
          await database.ref(`suspect-games/${lobbyCode}/answers/${playerId}`).set(myAnswer.trim());

          const gameSnapshot = await database.ref(`suspect-games/${lobbyCode}`).once('value');
          const currentGame = gameSnapshot.val();
          if (!currentGame) return;

          const answers = currentGame.answers || {};
          const answerCount = Object.keys(answers).length;

          if (answerCount >= currentGame.players.length) {
            await database.ref(`suspect-games/${lobbyCode}/phase`).set('voting');
          }
        } catch (err) {
          console.error('Submit answer error:', err);
          setError('Failed to submit answer. Please try again.');
        }
      };

      const lockInVote = async () => {
        if (!selectedVote) {
          setError('Please select a player to vote for');
          return;
        }

        try {
          setError('');
          await database.ref(`suspect-games/${lobbyCode}/votes/${playerId}`).set(selectedVote);

          const gameSnapshot = await database.ref(`suspect-games/${lobbyCode}`).once('value');
          const currentGame = gameSnapshot.val();
          if (!currentGame) return;

          const votes = currentGame.votes || {};
          if (Object.keys(votes).length >= currentGame.players.length) {
            await database.ref(`suspect-games/${lobbyCode}/phase`).set('recap');
            calculateResults();
          }
        } catch (err) {
          console.error(err);
          setError('Failed to lock in vote.');
        }
      };

      const calculateResults = async () => {
        try {
          const [gameSnap, lobbySnap] = await Promise.all([
            database.ref(`suspect-games/${lobbyCode}`).once('value'),
            database.ref(`suspect-lobbies/${lobbyCode}`).once('value'),
          ]);

          const game = gameSnap.val();
          const lobby = lobbySnap.val();

          if (!game || !lobby) throw new Error('Game or lobby missing');

          const votes = game.votes || {};
          const voteCount = {};
          Object.values(votes).forEach(votedId => {
            voteCount[votedId] = (voteCount[votedId] || 0) + 1;
          });

          let mostVotedId = null;
          let maxVotes = -1;
          Object.entries(voteCount).forEach(([id, count]) => {
            if (count > maxVotes) {
              maxVotes = count;
              mostVotedId = id;
            }
          });

          const suspectCaught = mostVotedId === game.suspectId;

          const updatedLobbyPlayers = (lobby.players || []).map(p => {
            let scoreAdd = 0;

            if (p.id === game.suspectId) {
              if (!suspectCaught) scoreAdd = 3;
            } else {
              if (suspectCaught) scoreAdd = 1;
            }

            return { ...p, score: (p.score || 0) + scoreAdd };
          });

          const updates = {};
          updates[`suspect-lobbies/${lobbyCode}/players`] = updatedLobbyPlayers;
          updates[`suspect-games/${lobbyCode}/recap`] = {
            suspectCaught,
            mostVotedId,
            suspectId: game.suspectId,
            voteCount
          };

          await database.ref().update(updates);
        } catch (err) {
          console.error('calculateResults error:', err);
        }
      };

      const nextRound = async () => {
        try {
          const lobbySnap = await database.ref(`suspect-lobbies/${lobbyCode}`).once('value');
          const lobby = lobbySnap.val();
          if (!lobby) return;

          const winner = lobby.players.find(p => (p.score || 0) >= 10);
          
          if (winner) {
            setScreen('winner');
            return;
          }

          const resetLobby = { ...lobby, status: 'waiting' };
          await database.ref(`suspect-lobbies/${lobbyCode}`).set(resetLobby);
          await database.ref(`suspect-games/${lobbyCode}`).remove();

          setGameState(null);
          setShowQuestion(false);
          setMyAnswer('');
          setSelectedVote('');
          setError('');

          const nextRoundNum = (resetLobby.roundNumber || 0) + 1;
          const orderStartIndex = (nextRoundNum - 1) % resetLobby.players.length;
          const orderedPlayers = [
            ...resetLobby.players.slice(orderStartIndex),
            ...resetLobby.players.slice(0, orderStartIndex)
          ];
          const questionPickerId = orderedPlayers[0].id;

          if (playerId === questionPickerId) {
            setScreen('question-select');
          } else {
            setScreen('lobby');
          }
        } catch (err) {
          console.error(err);
          setError('Failed to start next round.');
        }
      };

      const startNewGame = async () => {
        try {
          const lobbySnap = await database.ref(`suspect-lobbies/${lobbyCode}`).once('value');
          const lobby = lobbySnap.val();
          if (!lobby) return;

          const resetPlayers = lobby.players.map(p => ({ ...p, score: 0 }));
          const resetLobby = { 
            ...lobby, 
            status: 'waiting', 
            players: resetPlayers,
            roundNumber: 0 
          };
          
          await database.ref(`suspect-lobbies/${lobbyCode}`).set(resetLobby);
          await database.ref(`suspect-games/${lobbyCode}`).remove();

          setGameState(null);
          setShowQuestion(false);
          setMyAnswer('');
          setSelectedVote('');
          setError('');
          setScreen('lobby');
        } catch (err) {
          console.error(err);
          setError('Failed to start new game.');
        }
      };

      const continuePlayingAfterWin = async () => {
        try {
          const lobbySnap = await database.ref(`suspect-lobbies/${lobbyCode}`).once('value');
          const lobby = lobbySnap.val();
          if (!lobby) return;

          const resetLobby = { ...lobby, status: 'waiting' };
          await database.ref(`suspect-lobbies/${lobbyCode}`).set(resetLobby);
          await database.ref(`suspect-games/${lobbyCode}`).remove();

          setGameState(null);
          setShowQuestion(false);
          setMyAnswer('');
          setSelectedVote('');
          setError('');

          const nextRoundNum = (resetLobby.roundNumber || 0) + 1;
          const orderStartIndex = (nextRoundNum - 1) % resetLobby.players.length;
          const orderedPlayers = [
            ...resetLobby.players.slice(orderStartIndex),
            ...resetLobby.players.slice(0, orderStartIndex)
          ];
          const questionPickerId = orderedPlayers[0].id;

          if (playerId === questionPickerId) {
            setScreen('question-select');
          } else {
            setScreen('lobby');
          }
        } catch (err) {
          console.error(err);
          setError('Failed to continue playing.');
        }
      };

      const copyCode = () => {
        navigator.clipboard.writeText(lobbyCode);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const returnHome = () => {
        setScreen('home');
        setPlayerName('');
        setLobbyCode('');
        setCurrentLobby(null);
        setGameState(null);
        setShowQuestion(false);
        setError('');
        setMyAnswer('');
        setSelectedVote('');
      };

      // HOME SCREEN
      if (screen === 'home') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-400 via-red-500 to-pink-500 p-6 flex items-center justify-center">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in">
              <div className="text-center mb-8">
                <div className="inline-block bg-gradient-to-r from-orange-400 to-red-500 p-4 rounded-2xl mb-4 pulse-animation">
                  <Icon name="helpCircle" className="w-16 h-16 text-white" />
                </div>
                <h1 className="text-4xl font-bold text-gray-800 mb-2">🕵️ SUSpect!</h1>
                <p className="text-lg font-semibold text-orange-600 mb-1">Secret Question Game</p>
                <p className="text-gray-600 text-sm">One question is not like the others...</p>
              </div>

              <div className="space-y-4">
                <button
                  onClick={() => setScreen('create')}
                  className="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-4 px-6 rounded-xl transition-all transform hover:scale-105 shadow-lg"
                >
                  Create New Game
                </button>
                <button
                  onClick={() => setScreen('join')}
                  className="w-full bg-gradient-to-r from-red-500 to-pink-500 hover:from-red-600 hover:to-pink-600 text-white font-bold py-4 px-6 rounded-xl transition-all transform hover:scale-105 shadow-lg"
                >
                  Join Game
                </button>
              </div>

              <div className="mt-8 pt-6 border-t border-gray-200">
                <h3 className="font-bold text-gray-800 mb-3 text-sm">How to Play:</h3>
                <ol className="list-decimal list-inside space-y-1 text-xs text-gray-600">
                  <li>One player gets a secret question 🤫</li>
                  <li>Everyone else gets the normal question</li>
                  <li>All players answer their question</li>
                  <li>Vote on who had the secret question!</li>
                  <li>First to 10 points wins! 🏆</li>
                </ol>
              </div>
            </div>
          </div>
        );
      }

      // CREATE SCREEN
      if (screen === 'create') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-400 via-red-500 to-pink-500 p-6 flex items-center justify-center">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in">
              <button onClick={returnHome} className="mb-6 text-gray-600 hover:text-gray-800 flex items-center gap-2">
                <Icon name="home" className="w-4 h-4" />
                Back
              </button>

              <h2 className="text-3xl font-bold text-gray-800 mb-6">Create Game</h2>

              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Your Name</label>
                  <input
                    type="text"
                    value={playerName}
                    onChange={(e) => setPlayerName(e.target.value)}
                    onKeyPress={(e) => e.key === 'Enter' && createLobby()}
                    placeholder="Enter your name"
                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-orange-500 focus:outline-none text-lg"
                    maxLength={20}
                  />
                </div>

                {error && (
                  <div className="bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
                    {error}
                  </div>
                )}

                <button
                  onClick={createLobby}
                  className="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg"
                >
                  Create Lobby
                </button>
              </div>
            </div>
          </div>
        );
      }

      // JOIN SCREEN
      if (screen === 'join') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-400 via-red-500 to-pink-500 p-6 flex items-center justify-center">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in">
              <button onClick={returnHome} className="mb-6 text-gray-600 hover:text-gray-800 flex items-center gap-2">
                <Icon name="home" className="w-4 h-4" />
                Back
              </button>

              <h2 className="text-3xl font-bold text-gray-800 mb-6">Join Game</h2>

              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Your Name</label>
                  <input
                    type="text"
                    value={playerName}
                    onChange={(e) => setPlayerName(e.target.value)}
                    placeholder="Enter your name"
                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-red-500 focus:outline-none text-lg"
                    maxLength={20}
                  />
                </div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Lobby Code</label>
                  <input
                    type="text"
                    value={lobbyCode}
                    onChange={(e) => setLobbyCode(e.target.value)}
                    onKeyPress={(e) => e.key === 'Enter' && joinLobby()}
                    placeholder="1234"
                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-red-500 focus:outline-none text-lg font-mono"
                    maxLength={4}
                  />
                </div>

                {error && (
                  <div className="bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
                    {error}
                  </div>
                )}

                <button
                  onClick={joinLobby}
                  className="w-full bg-gradient-to-r from-red-500 to-pink-500 hover:from-red-600 hover:to-pink-600 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg"
                >
                  Join Lobby
                </button>
              </div>
            </div>
          </div>
        );
      }

      // LOBBY SCREEN
      if (screen === 'lobby' && currentLobby) {
        const roundNum = (currentLobby.roundNumber || 0) + 1;
        const orderStartIndex = (roundNum - 1) % currentLobby.players.length;
        const orderedPlayers = [
          ...currentLobby.players.slice(orderStartIndex),
          ...currentLobby.players.slice(0, orderStartIndex)
        ];
        const questionPicker = orderedPlayers[0];
        const isQuestionPicker = playerId === questionPicker.id;

        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-400 via-red-500 to-pink-500 p-6 flex items-center justify-center">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in">
              <button onClick={returnHome} className="mb-6 text-gray-600 hover:text-gray-800 flex items-center gap-2">
                <Icon name="home" className="w-4 h-4" />
                Leave
              </button>

              <div className="text-center mb-6">
                <h2 className="text-3xl font-bold text-gray-800 mb-3">Game Lobby</h2>
                <div className="inline-flex items-center gap-2 bg-gradient-to-r from-orange-100 to-pink-100 px-6 py-3 rounded-xl">
                  <p className="text-2xl font-bold text-orange-800 font-mono">{lobbyCode}</p>
                  <button onClick={copyCode} className="p-2 hover:bg-white/50 rounded-lg transition-colors">
                    <Icon name={copied ? "check" : "copy"} className="w-5 h-5 text-orange-600" />
                  </button>
                </div>
                <p className="text-sm text-gray-600 mt-2">Share this code with players</p>
              </div>

              {currentLobby.roundNumber > 0 && (
                <div className="mb-6 bg-yellow-50 border-2 border-yellow-200 rounded-xl p-4">
                  <p className="text-sm font-semibold text-yellow-800 text-center">
                    Round {roundNum} - {questionPicker.name} is choosing the question
                  </p>
                </div>
              )}

              <div className="mb-6">
                <div className="flex items-center gap-2 mb-3">
                  <Icon name="users" className="w-5 h-5 text-gray-700" />
                  <h3 className="font-bold text-gray-800">Players ({currentLobby.players.length})</h3>
                </div>
                <div className="space-y-2">
                  {currentLobby.players
                    .slice()
                    .sort((a, b) => (b.score || 0) - (a.score || 0))
                    .map((player) => (
                      <div
                        key={player.id}
                        className="bg-gradient-to-r from-gray-50 to-gray-100 px-4 py-3 rounded-xl flex items-center justify-between"
                      >
                        <span className="font-semibold text-gray-800">{player.name}</span>
                        <div className="flex items-center gap-2">
                          <span className="text-sm bg-orange-100 text-orange-800 px-3 py-1 rounded-full font-bold">
                            {player.score || 0} pts
                          </span>
                          {player.id === currentLobby.host && (
                            <span className="text-xs bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full font-bold">
                              HOST
                            </span>
                          )}
                        </div>
                      </div>
                    ))}
                </div>
              </div>

              {isQuestionPicker ? (
                <>
                  <button
                    onClick={startGame}
                    disabled={currentLobby.players.length < 3}
                    className="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                  >
                    <Icon name="play" className="w-5 h-5" />
                    {currentLobby.roundNumber === 0 ? 'Start Game' : 'Choose Question'}
                  </button>
                  {currentLobby.players.length < 3 && (
                    <p className="text-sm text-center text-gray-600 mt-3">
                      Need at least 3 players to start
                    </p>
                  )}
                </>
              ) : (
                <div className="bg-orange-50 border-2 border-orange-200 px-4 py-3 rounded-xl text-center">
                  <p className="text-orange-800 font-semibold">
                    Waiting for {questionPicker.name} to choose question...
                  </p>
                </div>
              )}
            </div>
          </div>
        );
      }

      // QUESTION SELECT SCREEN
      if (screen === 'question-select') {
        const randomQuestions = [...questionSets].sort(() => Math.random() - 0.5).slice(0, 4);

        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-400 via-red-500 to-pink-500 p-6 flex items-center justify-center">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in overflow-y-auto" style={{maxHeight: '90vh'}}>
              <button
                onClick={() => {
                  setScreen('lobby');
                  setError('');
                }}
                className="mb-6 text-gray-600 hover:text-gray-800 flex items-center gap-2"
              >
                <Icon name="home" className="w-4 h-4" />
                Back to Lobby
              </button>

              <h2 className="text-3xl font-bold text-gray-800 mb-2 text-center">Choose Question</h2>
              <p className="text-sm text-gray-600 text-center mb-6">
                Select a question pair for this round
              </p>

              <div className="space-y-3">
                {randomQuestions.map((qSet, index) => (
                  <button
                    key={index}
                    onClick={() => confirmQuestionAndStartGame(qSet)}
                    className="w-full bg-gradient-to-r from-orange-50 to-red-50 hover:from-orange-100 hover:to-red-100 text-left p-4 rounded-xl transition-all border-2 border-orange-200 hover:border-orange-400"
                  >
                    <p className="font-bold text-orange-800 mb-2">{qSet.theme}</p>
                    <p className="text-xs text-gray-700 mb-1">
                      <span className="font-semibold">Normal:</span> {qSet.normalQuestion}
                    </p>
                    <p className="text-xs text-gray-700">
                      <span className="font-semibold">Secret:</span> {qSet.secretQuestion}
                    </p>
                  </button>
                ))}
              </div>

              {error && (
                <div className="mt-4 bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
                  {error}
                </div>
              )}
            </div>
          </div>
        );
      }

      // GAME REVEAL SCREEN
      if (screen === 'game' && gameState) {
        const isSuspect = gameState.suspectId === playerId;
        const myPlayerIndex = gameState.playerOrder.indexOf(playerId);
        const myQuestion = isSuspect ? gameState.secretQuestion : gameState.normalQuestion;

        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-400 via-red-500 to-pink-500 p-6 flex items-center justify-center">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in">
              <div className="text-center mb-8">
                <h2 className="text-3xl font-bold text-gray-800 mb-2">Round {gameState.roundNumber}</h2>
                <p className="text-lg font-semibold text-orange-600 mb-1">{gameState.theme}</p>
                <p className="text-gray-600 text-sm">Keep your screen private!</p>
                <p className="text-xs text-gray-500 mt-2">
                  Answer phase starts automatically in 10 seconds...
                </p>
              </div>

              <div className="mb-8">
                <div className="bg-gradient-to-r from-orange-100 to-red-100 rounded-2xl p-6 text-center">
                  <p className="text-sm text-orange-700 font-semibold mb-3">YOUR QUESTION</p>

                  {!showQuestion ? (
                    <button
                      onClick={() => setShowQuestion(true)}
                      className="bg-white hover:bg-gray-50 text-orange-700 font-bold py-4 px-8 rounded-xl transition-all shadow-md flex items-center gap-3 mx-auto"
                    >
                      <Icon name="eye" className="w-5 h-5" />
                      Reveal My Question
                    </button>
                  ) : (
                    <div className="space-y-4">
                      <div className={`${isSuspect ? 'bg-red-500' : 'bg-green-500'} text-white py-4 px-6 rounded-xl`}>
                        <p className="text-xl font-bold mb-2">
                          {isSuspect ? '🕵️ You have the SECRET QUESTION!' : '✅ You have the NORMAL question'}
                        </p>
                        <p className="text-sm">You are #{myPlayerIndex + 1} in order</p>
                      </div>

                      <div className="bg-white rounded-xl p-4 border-2 border-orange-300">
                        <p className="text-gray-800 font-semibold text-lg">{myQuestion}</p>
                      </div>

                      <p className="text-sm text-gray-700">
                        {isSuspect
                          ? 'Try to blend in! Give an answer that could work for both questions.'
                          : 'Answer honestly, but watch for who might have the secret question!'}
                      </p>

                      <button
                        onClick={() => setShowQuestion(false)}
                        className="text-orange-600 hover:text-orange-700 text-sm flex items-center gap-1 mx-auto"
                      >
                        <Icon name="eyeOff" className="w-4 h-4" />
                        Hide
                      </button>
                    </div>
                  )}
                </div>
              </div>

              <div className="mb-6">
                <h3 className="font-bold text-gray-800 mb-3">Turn Order:</h3>
                <div className="space-y-2">
                  {gameState.players.map((player, index) => (
                    <div
                      key={player.id}
                      className={`px-4 py-3 rounded-xl flex items-center justify-between ${
                        player.id === playerId
                          ? 'bg-gradient-to-r from-orange-100 to-red-100 border-2 border-orange-300'
                          : 'bg-gray-50'
                      }`}
                    >
                      <span className="font-semibold text-gray-800">
                        #{index + 1} - {player.name}
                        {player.id === playerId && ' (You)'}
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              {myPlayerIndex === 0 && (
                <button
                  onClick={startAnswerPhase}
                  className="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg"
                >
                  Start Answer Phase (Manual)
                </button>
              )}
            </div>
          </div>
        );
      }

      // ANSWER SUBMISSION SCREEN
      if (screen === 'answer' && gameState) {
        const hasSubmitted = gameState.answers && gameState.answers[playerId];
        const isSuspect = gameState.suspectId === playerId;
        const myQuestion = isSuspect ? gameState.secretQuestion : gameState.normalQuestion;

        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-400 via-red-500 to-pink-500 p-6 flex items-center justify-center">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in overflow-y-auto" style={{maxHeight: '90vh'}}>
              <h2 className="text-3xl font-bold text-gray-800 mb-4 text-center">Submit Your Answer</h2>
              <p className="text-center text-gray-600 mb-6">{gameState.theme}</p>

              <div className="mb-6 bg-orange-50 border-2 border-orange-200 rounded-xl p-4">
                <p className="text-sm font-semibold text-orange-700 mb-2">Your Question:</p>
                <p className="text-gray-800 font-semibold">{myQuestion}</p>
              </div>

              <div className="mb-6 bg-blue-50 border-2 border-blue-200 rounded-xl p-4">
                <p className="text-sm text-blue-800 text-center">
                  Give a brief answer to your question!
                </p>
              </div>

              {!hasSubmitted ? (
                <div className="space-y-4">
                  <textarea
                    value={myAnswer}
                    onChange={(e) => setMyAnswer(e.target.value)}
                    placeholder="Type your answer here..."
                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-orange-500 focus:outline-none text-lg resize-none h-32"
                    maxLength={100}
                  />
                  <p className="text-xs text-gray-500 text-right">{myAnswer.length}/100</p>
                  <button
                    onClick={submitAnswer}
                    disabled={!myAnswer.trim()}
                    className="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <Icon name="send" className="w-5 h-5" />
                    Submit Answer
                  </button>
                </div>
              ) : (
                <div className="bg-green-50 border-2 border-green-200 rounded-xl p-4 text-center">
                  <Icon name="check" className="w-8 h-8 text-green-600 mx-auto mb-2" />
                  <p className="text-green-800 font-semibold">Answer submitted!</p>
                  <p className="text-sm text-green-700 mt-2">Waiting for other players...</p>
                </div>
              )}

              <div className="mt-6">
                <h3 className="font-bold text-gray-800 mb-3">Answer Progress:</h3>
                <div className="space-y-2">
                  {gameState.players.map((player, index) => {
                    const answer = gameState.answers?.[player.id];
                    return (
                      <div
                        key={player.id}
                        className={`px-4 py-3 rounded-xl ${
                          player.id === playerId
                            ? 'bg-gradient-to-r from-orange-100 to-red-100 border-2 border-orange-300'
                            : 'bg-gray-50'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <div className="flex-1">
                            <span className="font-semibold text-gray-800">
                              #{index + 1} - {player.name}
                              {player.id === playerId && ' (You)'}
                            </span>
                            {answer && (
                              <div className="text-blue-600 text-sm mt-1 italic">
                                "{answer}"
                              </div>
                            )}
                          </div>
                          {!answer ? (
                            <span className="text-gray-400 text-sm ml-2">Thinking...</span>
                          ) : (
                            <Icon name="check" className="w-5 h-5 text-green-600 ml-2 flex-shrink-0" />
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {error && (
                <div className="mt-4 bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
                  {error}
                </div>
              )}
            </div>
          </div>
        );
      }

      // VOTING SCREEN
      if (screen === 'voting' && gameState) {
        const hasLockedIn = gameState.votes && gameState.votes[playerId];

        const votes = gameState.votes || {};
        const voteCounts = {};
        Object.values(votes).forEach((votedId) => {
          voteCounts[votedId] = (voteCounts[votedId] || 0) + 1;
        });

        const showCounts = Object.keys(votes).length > 0;

        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-400 via-red-500 to-pink-500 p-6 flex items-center justify-center">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in overflow-y-auto" style={{maxHeight: '90vh'}}>
              <h2 className="text-3xl font-bold text-gray-800 mb-4 text-center">Vote for the Suspect!</h2>

              <div className="mb-6 bg-orange-50 border-2 border-orange-200 rounded-xl p-4">
                <p className="text-sm font-semibold text-orange-700 mb-2">The Questions Were:</p>
                <div className="space-y-2">
                  <div className="bg-white rounded-lg p-3">
                    <p className="text-xs text-gray-600 mb-1">Normal Question:</p>
                    <p className="text-sm text-gray-800 font-semibold">{gameState.normalQuestion}</p>
                  </div>
                  <div className="bg-red-100 rounded-lg p-3 border-2 border-red-300">
                    <p className="text-xs text-red-700 mb-1">Secret Question:</p>
                    <p className="text-sm text-red-800 font-semibold">{gameState.secretQuestion}</p>
                  </div>
                </div>
              </div>

              <div className="mb-6 bg-yellow-50 border-2 border-yellow-200 rounded-xl p-4">
                <p className="text-sm text-yellow-800 text-center font-semibold">
                  {hasLockedIn ? '✅ Vote locked in!' : '🔍 Who had the secret question?'}
                </p>
              </div>

              {!hasLockedIn ? (
                <>
                  <div className="space-y-2 mb-4">
                    {gameState.players.map((player) => (
                      <button
                        key={player.id}
                        onClick={() => setSelectedVote(player.id)}
                        className={`w-full px-4 py-3 rounded-xl transition-all border-2 ${
                          selectedVote === player.id
                            ? 'bg-gradient-to-r from-red-100 to-orange-200 border-red-400 shadow-md'
                            : 'bg-gradient-to-r from-gray-50 to-gray-100 hover:from-red-50 hover:to-orange-100 border-gray-300 hover:border-red-200'
                        }`}
                      >
                        <div className="flex items-center justify-between gap-3">
                          <div className="text-left flex-1">
                            <div className="font-semibold text-gray-800 flex items-center gap-2">
                              {selectedVote === player.id && <span className="text-red-600">→</span>}
                              {player.name}
                            </div>
                            {gameState.answers?.[player.id] && (
                              <div className="text-sm text-blue-600 mt-1 italic">
                                "{gameState.answers[player.id]}"
                              </div>
                            )}
                          </div>

                          {showCounts && (
                            <span className="text-xs bg-red-200 text-red-900 px-3 py-1 rounded-full font-bold">
                              {voteCounts[player.id] || 0}
                            </span>
                          )}
                        </div>
                      </button>
                    ))}
                  </div>

                  <button
                    onClick={lockInVote}
                    disabled={!selectedVote}
                    className="w-full bg-gradient-to-r from-red-500 to-pink-500 hover:from-red-600 hover:to-pink-600 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                  >
                    <Icon name="lock" className="w-5 h-5" />
                    Lock In Vote
                  </button>
                  {selectedVote && (
                    <p className="text-sm text-center text-gray-600 mt-2">
                      Click a different player to change your vote before locking in
                    </p>
                  )}
                </>
              ) : (
                <div className="bg-green-50 border-2 border-green-200 rounded-xl p-4 text-center mb-6">
                  <Icon name="check" className="w-8 h-8 text-green-600 mx-auto mb-2" />
                  <p className="text-green-800 font-semibold">Vote locked in!</p>
                  <p className="text-sm text-green-700 mt-2">Waiting for other players...</p>
                </div>
              )}

              <div className="mb-6 mt-6">
                <h3 className="font-bold text-gray-800 mb-3">Voting Progress:</h3>
                <div className="space-y-2">
                  {gameState.players.map((player) => {
                    const voted = gameState.votes?.[player.id];
                    return (
                      <div
                        key={player.id}
                        className="bg-gray-50 px-4 py-3 rounded-xl flex items-center justify-between"
                      >
                        <span className="font-semibold text-gray-800">{player.name}</span>
                        {voted ? (
                          <Icon name="check" className="w-5 h-5 text-green-600" />
                        ) : (
                          <span className="text-gray-400 text-sm">Voting...</span>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {error && (
                <div className="bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
                  {error}
                </div>
              )}
            </div>
          </div>
        );
      }

      // RECAP SCREEN
      if (screen === 'recap' && gameState && gameState.recap) {
        const { suspectCaught, mostVotedId, suspectId, voteCount } = gameState.recap;
        const suspect = gameState.players.find(p => p.id === suspectId);
        const mostVoted = gameState.players.find(p => p.id === mostVotedId);
        
        const winner = currentLobby?.players.find(p => (p.score || 0) >= 10);

        return (
          <div className="min-h-screen bg-gradient-to-br from-orange-400 via-red-500 to-pink-500 p-6 flex items-center justify-center">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in overflow-y-auto" style={{maxHeight: '90vh'}}>
              <div className="text-center mb-6">
                <Icon name="trophy" className="w-16 h-16 text-yellow-500 mx-auto mb-4" />
                <h2 className="text-3xl font-bold text-gray-800 mb-2">Round {gameState.roundNumber} Results</h2>
              </div>

              <div className="space-y-4 mb-6">
                <div className={`${suspectCaught ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} border-2 rounded-xl p-4`}>
                  <p className="font-bold text-lg mb-2">
                    {suspectCaught ? '✅ Suspect Was Caught!' : '❌ Suspect Got Away!'}
                  </p>
                  <p className="text-sm mb-1">
                    <strong>The Suspect:</strong> {suspect?.name}
                  </p>
                  <p className="text-sm">
                    <strong>Most Voted:</strong> {mostVoted?.name || 'No votes?'}
                  </p>
                </div>

                <div className="bg-orange-50 border-2 border-orange-200 rounded-xl p-4">
                  <p className="font-bold text-lg mb-3 text-center">Vote Count</p>
                  <div className="space-y-2">
                    {gameState.players.map((player) => (
                      <div 
                        key={player.id} 
                        className={`flex items-center justify-between p-2 rounded-lg ${
                          player.id === suspectId ? 'bg-red-100 border border-red-300' : 'bg-white'
                        }`}
                      >
                        <span className="font-semibold text-sm">
                          {player.name}
                          {player.id === suspectId && ' 🕵️'}
                        </span>
                        <span className="bg-orange-200 text-orange-900 px-3 py-1 rounded-full font-bold text-xs">
                          {voteCount[player.id] || 0} votes
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-purple-50 border-2 border-purple-200 rounded-xl p-4">
                  <p className="font-bold text-lg mb-3 text-center">Scoreboard</p>
                  <div className="space-y-2">
                    {(currentLobby?.players || [])
                      .slice()
                      .sort((a, b) => (b.score || 0) - (a.score || 0))
                      .map((player, index) => (
                        <div key={player.id} className="flex items-center justify-between">
                          <span className="font-semibold">
                            {index + 1}. {player.name}
                          </span>
                          <span className="bg-orange-100 text-orange-800 px-3 py-1 rounded-full font-bold text-sm">
                            {player.score || 0} pts
                          </span>
                        </div>
                      ))}
                  </div>
                </div>

                {winner && (
                  <div className="bg-yellow-50 border-2 border-yellow-400 rounded-xl p-4 text-center">
                    <p className="text-lg font-bold text-yellow-800 mb-1">
                      🎉 {winner.name} reached 10 points! 🎉
                    </p>
                    <p className="text-sm text-yellow-700">
                      Winner screen loading...
                    </p>
                  </div>
                )}
              </div>

              {!winner && (
                <button
                  onClick={nextRound}
                  className="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg"
                >
                  Next Round
                </button>
              )}

              {error && (
                <div className="mt-4 bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
                  {error}
                </div>
              )}
            </div>
          </div>
        );
      }

      // WINNER SCREEN
      if (screen === 'winner' && currentLobby) {
        const winner = currentLobby.players
          .slice()
          .sort((a, b) => (b.score || 0) - (a.score || 0))[0];

        return (
          <div className="min-h-screen bg-gradient-to-br from-yellow-400 via-orange-500 to-red-500 p-6 flex items-center justify-center">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 fade-in">
              <div className="text-center mb-6">
                <div className="inline-block bg-gradient-to-r from-yellow-400 to-orange-500 p-6 rounded-full mb-4 pulse-animation">
                  <Icon name="trophy" className="w-20 h-20 text-white" />
                </div>
                <h1 className="text-5xl font-bold text-gray-800 mb-4">🎉 WINNER! 🎉</h1>
                <div className="bg-gradient-to-r from-yellow-100 to-orange-100 border-4 border-yellow-400 rounded-2xl p-6 mb-4">
                  <p className="text-3xl font-bold text-gray-800 mb-2">{winner.name}</p>
                  <p className="text-xl text-gray-700">
                    <span className="text-4xl font-bold text-orange-600">{winner.score}</span> points
                  </p>
                </div>
                <p className="text-gray-600 text-lg">First to reach 10 points!</p>
              </div>

              <div className="bg-purple-50 border-2 border-purple-200 rounded-xl p-6 mb-6">
                <p className="font-bold text-lg mb-4 text-center text-gray-800">Final Scoreboard</p>
                <div className="space-y-3">
                  {currentLobby.players
                    .slice()
                    .sort((a, b) => (b.score || 0) - (a.score || 0))
                    .map((player, index) => (
                      <div 
                        key={player.id} 
                        className={`flex items-center justify-between p-3 rounded-xl ${
                          index === 0 
                            ? 'bg-gradient-to-r from-yellow-200 to-orange-200 border-2 border-yellow-400' 
                            : 'bg-white border border-gray-200'
                        }`}
                      >
                        <span className="font-semibold text-gray-800">
                          {index === 0 && '👑 '}
                          {index + 1}. {player.name}
                        </span>
                        <span className={`px-4 py-1 rounded-full font-bold text-sm ${
                          index === 0 
                            ? 'bg-yellow-400 text-yellow-900' 
                            : 'bg-orange-100 text-orange-800'
                        }`}>
                          {player.score || 0} pts
                        </span>
                      </div>
                    ))}
                </div>
              </div>

              <div className="space-y-3">
                <button
                  onClick={startNewGame}
                  className="w-full bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2"
                >
                  <Icon name="sparkles" className="w-5 h-5" />
                  New Game (Reset Scores)
                </button>
                
                <button
                  onClick={continuePlayingAfterWin}
                  className="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2"
                >
                  <Icon name="play" className="w-5 h-5" />
                  Keep Playing
                </button>

                <button
                  onClick={returnHome}
                  className="w-full bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-xl transition-all"
                >
                  Exit to Home
                </button>
              </div>

              {error && (
                <div className="mt-4 bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
                  {error}
                </div>
              )}
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SuspectGame />);
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('ServiceWorker registered:', registration.scope);
          })
          .catch((err) => {
            console.log('ServiceWorker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
